version: "3"
services:
  app:
    build: ./app/
    image: event-planner-api:latest 
    container_name: event-planner-api
    restart: unless-stopped
    env_file:
    - ./app/.env
    volumes:
      - ./app:/app
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - event-planner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    environment:
      - CHROMA_DB_IMPL=chromadb.db.impl.sqlite.SqLiteDB
      - CHROMA_PERSIST_DIRECTORY=/chromadb_data
      - CHROMA_API_IMPL=chromadb.api.fastapi.FastAPI
      - CHROMA_SERVER_HTTP_PORT=8000
    volumes:
      # - ./healthcheck_chroma.py:/healthcheck_chroma.py
      - ./chroma_db_designers1:/chromadb_data
    networks:
      - event-planner-network
    # healthcheck: # пока без него, не получается настроить, видимо надо создавать отдельный образ для
    #   test: ["CMD", "python", "/healthcheck_chroma.py"]
    #   # test: ["CMD", "nc", "-z", "0.0.0.0", "8000"] # проверяем что порт открыт, тк курл ниже почему-то не работает
    #   interval: 15s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 30s
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://0.0.0.0:8000/api/v2/heartbeat"] # поменяла localhost на 0.0.0.0 вроде работает (нет)
    #   interval: 15s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 30s
  ml_worker:
    build: ./ml_worker/
    image: event-planner-ml-worker:latest
    container_name: event-planner-ml-worker
    restart: unless-stopped

    volumes:
      - ./ml_worker:/app
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # chromadb:
      #   condition: service_healthy
    networks:
      - event-planner-network
  web:
    image: nginx:latest
    container_name: event-planner-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - event-planner-network
  streamlit:
    build: app/webui
    ports:
      - 8501:8501
    volumes:
      - ./app:/app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - chromadb
      - db
      - app
    networks:
      - event-planner-network
  db:
    image: postgres:16-alpine
    container_name: event-planner-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - event-planner-network
  rabbitmq:
    image: rabbitmq:3.13.1-management-alpine
    container_name: rabbitmq_for_planner
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit disk_free_limit 2147483648
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "15672:15672"  # Management UI
      - "5672:5672"    # AMQP protocol
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 20s
      timeout: 10s
      retries: 3
    networks:
      - event-planner-network
  ollama:
    image: ollama/ollama
    container_name: gemma-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MODELS=gemma3:1b
    networks:
      - event-planner-network

volumes:
  postgres_data:
  rabbitmq_data:
  ollama_data:
  chromadb_data:

networks:
  event-planner-network:
    name: event-planner-network
    driver: bridge